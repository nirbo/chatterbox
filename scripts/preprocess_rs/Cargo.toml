[package]
name = "preprocess-cpu"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
indicatif = { version = "0.17", features = ["rayon"] }
rayon = "1"
rubato = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.20"

[profile.release]
opt-level = 3
lto = true
